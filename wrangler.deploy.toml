# Production template. scripts/cloudflare.mjs resolves the existing DB binding
# into ignored wrangler.runtime.toml; CI applies migrations and deploys that file.
# Keep this filename: wrangler.toml auto-discovery conflicts with local Vite D1.
# See docs/cloudflare-deploy.md. Cloudflare Workers is the sole hosting target.

name = "mirodnd-3d-dice-roller"
main = "dist/server/index.js"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"

[[d1_databases]]
binding = "DB"
database_name = "vincentsviberoller"
# Local-test placeholder. The deployment script requires a real existing DB ID.
database_id = "00000000-0000-0000-0000-000000000000"
# Points `wrangler d1 migrations apply` (run via `pnpm run cf:d1:migrate`) at
# drizzle-kit's output folder instead of the wrangler default ("migrations").
migrations_dir = "drizzle"

# Optional: attach your own domain instead of the workers.dev subdomain
# Wrangler prints after the first deploy. Uncomment once the domain is added
# to your Cloudflare account (see docs/cloudflare-deploy.md).
# [[routes]]
# pattern = "dice.example.com"
# custom_domain = true
