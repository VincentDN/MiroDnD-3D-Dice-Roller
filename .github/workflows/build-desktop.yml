name: Build, test and publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a production migration/deploy in progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'

jobs:
  web:
    name: Browser and Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/test-integration.mjs --browser
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-web
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  desktop:
    name: Portable Windows EXE
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run package:portable
      - run: npm run test:portable
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash release/VincentsVibeRoller.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  VincentsVibeRoller.exe" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VincentsVibeRoller-Windows
          path: |
            desktop/release/VincentsVibeRoller.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: PR download instructions
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo 'Download VincentsVibeRoller-Windows from this run, extract the artifact ZIP, then open VincentsVibeRoller.exe. No installation required. The executable connects to the production room service; the candidate web app is tested separately against local D1.' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish portable release
    needs: [web, desktop]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VincentsVibeRoller-Windows
          path: release
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./desktop/package.json').version")
          tag="desktop-v${version}-build.${GITHUB_RUN_NUMBER}"
          cat > /tmp/release-notes.md <<EOF_NOTES
          Download **VincentsVibeRoller.exe** and run it. No installer or Node.js needed.

          This portable Windows x64 app connects to the shared Cloudflare room service; an internet connection is required. Browser players use https://mirodnd-3d-dice-roller.vincent-de-nil.workers.dev.

          Source: ${GITHUB_SHA}. Validated by web/API/browser tests and a native portable-executable launch check. The executable is unsigned. SHA256SUMS.txt is attached.
          EOF_NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --latest \
              --title "VincentsVibeRoller ${version} (build ${GITHUB_RUN_NUMBER})" \
              --notes-file /tmp/release-notes.md --repo "$GITHUB_REPOSITORY"
          fi

  deploy:
    name: Update live Cloudflare site
    needs: [release]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Add CLOUDFLARE_API_TOKEN in repository Actions secrets.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Add CLOUDFLARE_ACCOUNT_ID in repository Actions secrets.'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-web
          path: dist
      - name: Migrate existing DB and deploy tested assets
        run: pnpm run deploy:built
      - name: Verify production
        run: node scripts/check-production.mjs
